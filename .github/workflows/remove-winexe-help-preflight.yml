name: Remove Winexe Help Preflight

on:
  pull_request:
    branches:
      - agent/deepseek-thinking-controls

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python .github/scripts/remove_winexe_help_preflight.py
      - name: Commit Server change
        run: |
          git add server/server.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove redundant winexe help preflight" || exit 0
          git push origin HEAD:${{ github.head_ref }}
