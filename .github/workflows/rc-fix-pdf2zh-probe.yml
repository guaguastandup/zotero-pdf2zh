name: RC Fix pdf2zh Runtime Probe

on:
  push:
    branches:
      - agent/deepseek-thinking-controls

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime-probe migration
        run: python .github/scripts/rc_fix_pdf2zh_probe.py

      - name: Validate Python sources and static capability probe
        run: |
          python -m pip install toml packaging
          python -m py_compile server/utils/environment_lifecycle.py server/utils/deepseek_thinking.py
          PYTHONPATH=server python - <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          from utils.environment_lifecycle import runtime_supports_deepseek_thinking
          from utils.deepseek_thinking import _python_for_invocation_prefix

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / 'pdf2zh_next/config').mkdir(parents=True)
              (root / 'pdf2zh_next/config/translate_engine_model.py').write_text(
                  'deepseek_thinking_mode = None\ndeepseek_reasoning_effort = None\n',
                  encoding='utf-8',
              )
              (root / 'pdf2zh_next/config/main.py').write_text(
                  'args_name = field_name.replace("_", "-").lower()\n',
                  encoding='utf-8',
              )
              dist = root / 'pdf2zh_next-2.9.0.dist-info'
              dist.mkdir()
              (dist / 'METADATA').write_text(
                  'Metadata-Version: 2.1\nName: pdf2zh-next\nVersion: 2.9.0\n',
                  encoding='utf-8',
              )
              previous = os.environ.get('PYTHONPATH', '')
              os.environ['PYTHONPATH'] = str(root) + (os.pathsep + previous if previous else '')
              assert runtime_supports_deepseek_thinking(Path(sys.executable))

          assert _python_for_invocation_prefix([sys.executable, '-m', 'pdf2zh_next']) == Path(sys.executable)

          lifecycle = Path('server/utils/environment_lifecycle.py').read_text(encoding='utf-8')
          validate_block = lifecycle.split('def validate_environment(', 1)[1].split('def _freeze_exact_requirements', 1)[0]
          assert '"--help"' not in validate_block
          print('Static pdf2zh runtime probe validation OK')
          PY

      - name: Commit validated runtime-probe fix
        run: |
          git add server/utils/environment_lifecycle.py server/utils/deepseek_thinking.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: avoid heavyweight pdf2zh_next help probes"
          git push origin HEAD:${GITHUB_REF_NAME}
