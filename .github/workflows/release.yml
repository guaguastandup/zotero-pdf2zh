name: Release

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches plugin and Server versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          expected = tag[1:] if tag.startswith('v') else tag
          plugin_version = str(json.loads(Path('plugin/package.json').read_text(encoding='utf-8'))['version'])
          server_text = Path('server/server.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)["\x27]', server_text, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find server __version__')
          server_version = match.group(1)
          print(f'tag={tag} plugin={plugin_version} server={server_version}')
          if plugin_version != expected or server_version != expected:
              raise SystemExit('Release tag does not match plugin/Server versions')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan release sources and archives for secrets
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          PATH="$RUNNER_TEMP/gitleaks-bin:$PATH" python tools/release.py

      - name: Validate Server sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m compileall -q server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        run: cd plugin/ && npm ci

      - name: Lint plugin
        run: cd plugin/ && npm run lint:check

      - name: Build plugin
        run: cd plugin/ && npm run build

      - name: Verify canonical XPI exists
        run: test -f plugin/build/zotero-pdf-2-zh.xpi

      # Build and validate every artifact before creating/updating the GitHub
      # Release. This prevents a failed Server packaging step from leaving a
      # release that contains only the plugin artifact.
      - name: Build server.zip from tagged source
        run: |
          python tools/package_server.py --output server.zip
          python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Release plugin to GitHub
        run: |
          cd plugin/ && npm run release
          sleep 1s

      - name: Upload canonical Release assets
        run: |
          gh release upload ${{ github.ref_name }} plugin/build/zotero-pdf-2-zh.xpi --clobber
          gh release upload ${{ github.ref_name }} server.zip --clobber

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
