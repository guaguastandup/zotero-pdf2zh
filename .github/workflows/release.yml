name: Release

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches plugin and Server versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          expected = tag[1:] if tag.startswith('v') else tag
          plugin_version = str(json.loads(Path('plugin/package.json').read_text(encoding='utf-8'))['version'])
          server_text = Path('server/server.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)["\x27]', server_text, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find server __version__')
          server_version = match.group(1)
          print(f'tag={tag} plugin={plugin_version} server={server_version}')
          if plugin_version != expected or server_version != expected:
              raise SystemExit('Release tag does not match plugin/Server versions')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install deps
        run: cd plugin/ && npm ci

      - name: Build
        run: |
          cd plugin/ && npm run build

      - name: Release plugin to GitHub
        run: |
          cd plugin/ && npm run release
          sleep 1s

      - name: Build server.zip from current source
        run: |
          rm -f server.zip
          cd server
          zip -r ../server.zip . \
            -x 'translated/*' \
            -x 'zotero-pdf2zh-venv/*' \
            -x 'zotero-pdf2zh-next-venv/*' \
            -x 'zotero-pdf2zh-venv.staging/*' \
            -x 'zotero-pdf2zh-next-venv.staging/*' \
            -x 'zotero-pdf2zh-venv.backup/*' \
            -x 'zotero-pdf2zh-next-venv.backup/*' \
            -x 'config/package_update_state.json' \
            -x 'config/*.invalid.bak' \
            -x 'config/*.invalid.*.bak' \
            -x '__pycache__/*' \
            -x '*/__pycache__/*' \
            -x '*.pyc' \
            -x '.DS_Store'
          cd ..
          unzip -l server.zip | head -80

      - name: Upload server.zip to Release
        run: gh release upload ${{ github.ref_name }} server.zip --clobber

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
