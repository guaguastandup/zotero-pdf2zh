name: Release

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: cd plugin/ && npm install

      - name: Build
        run: |
          cd plugin/ && npm run build

      - name: Release plugin to GitHub
        run: |
          cd plugin/ && npm run release
          sleep 1s

      # Always build the Server archive from the tagged source tree.
      # Do not upload the pre-committed root server.zip because it can lag behind
      # the actual server/ directory and silently ship stale code.
      - name: Build server.zip from current source
        run: |
          rm -f server.zip
          cd server
          zip -r ../server.zip . \
            -x 'translated/*' \
            -x 'zotero-pdf2zh-venv/*' \
            -x 'zotero-pdf2zh-next-venv/*' \
            -x '__pycache__/*' \
            -x '*/__pycache__/*' \
            -x '*.pyc' \
            -x '.DS_Store'
          cd ..
          unzip -l server.zip | head -80

      - name: Upload server.zip to Release
        run: gh release upload ${{ github.ref_name }} server.zip --clobber

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
