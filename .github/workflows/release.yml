name: Release

on:
  push:
    tags:
      - 'v**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches plugin and Server versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          expected = tag[1:] if tag.startswith('v') else tag
          plugin_version = str(json.loads(Path('plugin/package.json').read_text(encoding='utf-8'))['version'])
          server_text = Path('server/server.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)["\x27]', server_text, re.MULTILINE)
          if not match:
              raise SystemExit('Could not find server __version__')
          server_version = match.group(1)
          print(f'tag={tag} plugin={plugin_version} server={server_version}')
          if plugin_version != expected or server_version != expected:
              raise SystemExit('Release tag does not match plugin/Server versions')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Server sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install toml packaging flask pypdf pymupdf
          python -m compileall -q server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install plugin dependencies
        run: cd plugin/ && npm ci

      - name: Lint plugin
        run: cd plugin/ && npm run lint:check

      - name: Build plugin
        run: cd plugin/ && npm run build

      - name: Verify canonical XPI exists
        run: test -f plugin/build/zotero-pdf-2-zh.xpi

      - name: Release plugin to GitHub
        run: |
          cd plugin/ && npm run release
          sleep 1s

      - name: Build server.zip from tagged source
        run: |
          rm -f server.zip
          zip -r server.zip server \
            -x 'server/translated/*' \
            -x 'server/zotero-pdf2zh-venv/*' \
            -x 'server/zotero-pdf2zh-next-venv/*' \
            -x 'server/zotero-pdf2zh-venv.staging/*' \
            -x 'server/zotero-pdf2zh-next-venv.staging/*' \
            -x 'server/zotero-pdf2zh-venv.backup/*' \
            -x 'server/zotero-pdf2zh-next-venv.backup/*' \
            -x 'server/config/config.json' \
            -x 'server/config/config.toml' \
            -x 'server/config/venv.json' \
            -x 'server/config/package_update_state.json' \
            -x 'server/config/*.invalid.bak' \
            -x 'server/config/*.invalid.*.bak' \
            -x 'server/__pycache__/*' \
            -x 'server/*/__pycache__/*' \
            -x 'server/**/*.pyc' \
            -x '.DS_Store'
          unzip -l server.zip | head -80
          unzip -l server.zip | grep -q 'server/server.py'
          unzip -l server.zip | grep -q 'server/config/config.toml.example'
          unzip -l server.zip | grep -q 'server/update_packages.py'
          unzip -l server.zip | grep -q 'server/utils/deepseek_thinking.py'

      - name: Upload canonical Release assets
        run: |
          gh release upload ${{ github.ref_name }} plugin/build/zotero-pdf-2-zh.xpi --clobber
          gh release upload ${{ github.ref_name }} server.zip --clobber

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
