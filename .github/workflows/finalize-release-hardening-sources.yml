name: Finalize Release Hardening Sources

on:
  pull_request:
    branches:
      - agent/deepseek-thinking-controls

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python .github/scripts/finalize_release_hardening_sources.py
      - name: Commit source refinements
        run: |
          git add server docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize release environment semantics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
