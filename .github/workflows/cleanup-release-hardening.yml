name: Cleanup Release Hardening

on:
  pull_request:
    branches:
      - agent/deepseek-thinking-controls

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python .github/scripts/cleanup_release_hardening.py
      - name: Commit cleanup
        run: |
          git add -A ':!.github/workflows/cleanup-release-hardening.yml' ':!.github/workflows/ci.yml' ':!.github/workflows/release.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove hardening scaffolding" || exit 0
          git push origin HEAD:${{ github.head_ref }}
