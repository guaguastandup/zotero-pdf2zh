name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    server-python:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install Server validation deps
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install toml packaging pymupdf flask pypdf
                  python -m pip install --no-deps pdf2zh-next==2.9.0

            - name: Compile Server sources
              run: python -m compileall -q server

            - name: Import lifecycle modules
              env:
                  PYTHONPATH: server
              run: |
                  python - <<'PY'
                  from utils import config_migration, deepseek_thinking, environment_lifecycle, package_network
                  from utils.venv import VirtualEnvManager
                  assert callable(config_migration.prepare_config_files)
                  assert callable(environment_lifecycle.transactional_install_or_update)
                  assert VirtualEnvManager is not None
                  print('Server lifecycle imports OK')
                  PY

            - name: Test static pdf2zh_next capability probe
              env:
                  PYTHONPATH: server
              run: |
                  python - <<'PY'
                  import sys
                  from pathlib import Path
                  from utils.environment_lifecycle import runtime_supports_deepseek_thinking

                  assert runtime_supports_deepseek_thinking(Path(sys.executable))
                  lifecycle = Path('server/utils/environment_lifecycle.py').read_text(encoding='utf-8')
                  validate_block = lifecycle.split('def validate_environment(', 1)[1].split('def _freeze_exact_requirements', 1)[0]
                  assert 'pdf2zh_next --help' not in validate_block
                  venv = Path('server/utils/venv.py').read_text(encoding='utf-8')
                  health_block = venv.split('def _requirements_ok(', 1)[1].split('def check_envtool', 1)[0]
                  assert '"pdf2zh_next", "--help"' not in health_block
                  assert '"-m", "pdf2zh_next", "--help"' not in health_block
                  deepseek = Path('server/utils/deepseek_thinking.py').read_text(encoding='utf-8')
                  assert 'runtime_supports_deepseek_thinking(python_path)' in deepseek
                  print('Static capability probes OK')
                  PY

            - name: Test managed config migration
              env:
                  PYTHONPATH: server
              run: |
                  python - <<'PY'
                  from utils.config_migration import _merge_defaults
                  defaults={'pdf2zh_next':{'uv':{'python_version':'3.12','packages':['pdf2zh_next>=2.9.0,<3.0.0','pypdf']}}}
                  current={'pdf2zh_next':{'uv':{'python_version':'3.11','packages':['pdf2zh_next==2.8.2','pypdf==6.0.0','my-private-helper==1.0']}}}
                  merged=_merge_defaults(defaults,current)
                  packages=merged['pdf2zh_next']['uv']['packages']
                  assert merged['pdf2zh_next']['uv']['python_version']=='3.11'
                  assert 'pdf2zh_next>=2.9.0,<3.0.0' in packages
                  assert 'pypdf' in packages
                  assert 'pdf2zh_next==2.8.2' not in packages
                  assert 'pypdf==6.0.0' not in packages
                  assert 'my-private-helper==1.0' in packages
                  print('Managed config migration OK')
                  PY

            - name: Test environment manager semantics
              env:
                  PYTHONPATH: server
              run: |
                  python - <<'PY'
                  import sys
                  from pathlib import Path
                  from unittest.mock import patch
                  from utils.venv import VirtualEnvManager

                  names={'pdf2zh':'zotero-pdf2zh-venv','pdf2zh_next':'zotero-pdf2zh-next-venv'}
                  uv=VirtualEnvManager('missing.json', names, 'uv', skip_install=True)
                  conda=VirtualEnvManager('missing.json', names, 'conda', skip_install=True)
                  auto=VirtualEnvManager('missing.json', names, 'auto', skip_install=True)
                  assert uv._preferred_tools() == ['uv']
                  assert conda._preferred_tools() == ['conda']
                  assert auto._preferred_tools() == ['uv', 'conda']

                  with patch('utils.venv.shutil.which', side_effect=lambda name: '/bin/uv' if name == 'uv' else '/bin/conda'):
                      assert auto._install_tools() == ['uv']
                  with patch('utils.venv.shutil.which', side_effect=lambda name: None if name == 'uv' else '/bin/conda'):
                      assert auto._install_tools() == ['conda']

                  # Discovery must check all existing candidates before repairing.
                  auto.skip_install = False
                  fake_uv = ('uv', Path('/tmp/fake-uv'), Path(sys.executable))
                  fake_conda = ('conda', Path('/tmp/fake-conda'), Path(sys.executable))
                  auto._existing = lambda engine, tool: fake_uv if tool == 'uv' else fake_conda
                  auto._requirements_ok = lambda engine, tool, python: tool == 'conda'
                  auto.install_packages = lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError('repair should not run before healthy conda is discovered'))
                  assert auto.ensure_env('pdf2zh')
                  assert auto.curr_envtool == 'conda'
                  print('Environment manager semantics OK')
                  PY

            - name: Test maintenance commands auto-detect existing manager
              run: |
                  python - <<'PY'
                  from pathlib import Path
                  server = Path('server/server.py').read_text(encoding='utf-8')
                  assert "default_env_tool = 'auto'" in server
                  for path in ('server/update_packages.py', 'server/manage_packages.py'):
                      text=Path(path).read_text(encoding='utf-8')
                      pos=text.index('"--env-tool"')
                      block=text[pos:pos+600]
                      assert 'default="auto"' in block, f'{path}: --env-tool must default to auto'
                  print('Maintenance auto-detection defaults OK')
                  PY

            - name: Test PDF layout state transitions
              env:
                  PYTHONPATH: server
              run: |
                  python - <<'PY'
                  import tempfile
                  from pathlib import Path
                  from types import SimpleNamespace
                  import pymupdf as fitz
                  from utils.cropper import Cropper

                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      lr = root / 'paper.LR_dual.pdf'
                      doc = fitz.open()
                      page = doc.new_page(width=800, height=600)
                      page.insert_text((50, 80), 'Translated left column')
                      page.insert_text((250, 80), 'Translated right column')
                      page.insert_text((450, 80), 'Original left column')
                      page.insert_text((650, 80), 'Original right column')
                      doc.save(lr)
                      doc.close()

                      cropper = Cropper()
                      lr_path, tb_path = cropper.pdf_dual_mode(str(lr), 'LR', 'TB')
                      assert Path(lr_path) == lr
                      assert Path(tb_path).exists()
                      with fitz.open(tb_path) as tb:
                          assert len(tb) == 2
                          assert tb[0].rect.width == 400

                      config = SimpleNamespace(pdf_w_offset=0, pdf_h_offset=0, pdf_offset_ratio=5.0)

                      crop_compare = root / 'paper.crop-compare.pdf'
                      cropper.crop_pdf(config, tb_path, 'dual', str(crop_compare), 'crop-compare')
                      assert crop_compare.exists()
                      with fitz.open(crop_compare) as result:
                          assert len(result) == 2
                          assert result[0].rect.width == 400

                      dual_cut = root / 'paper.dual-cut.pdf'
                      cropper.crop_pdf(config, tb_path, 'dual', str(dual_cut), 'dual-cut')
                      assert dual_cut.exists()
                      with fitz.open(dual_cut) as result:
                          assert len(result) == 4
                          assert result[0].rect.width == 200

                  server = Path('server/server.py').read_text(encoding='utf-8')
                  crop_route = server.split('def crop(self):', 1)[1].split('def crop_compare(self):', 1)[0]
                  assert 'source_path = input_path' in crop_route
                  assert "_, source_path = self.cropper.pdf_dual_mode(input_path, 'LR', 'TB')" in crop_route
                  assert 'self.cropper.crop_pdf(config, source_path, infile_type, new_path, new_type)' in crop_route
                  assert "infile_type == 'crop-compare'" in server
                  assert "infile_type == 'compare'" in server
                  print('PDF layout state transitions OK')
                  PY

            - name: Test Server security, config schema, and updater invariants
              env:
                  PYTHONPATH: server
              run: |
                  python - <<'PY'
                  import json
                  import os
                  import runpy
                  import sys
                  import tempfile
                  import zipfile
                  from pathlib import Path
                  import toml

                  namespace = runpy.run_path('server/server.py')
                  translator = namespace['PDFTranslator']
                  assert translator._safe_upload_filename('paper.pdf') == 'paper.pdf'
                  for bad in ('../paper.pdf', 'a/b.pdf', r'a\b.pdf', '..', '.', 'note.txt', '', None):
                      try:
                          translator._safe_upload_filename(bad)
                      except ValueError:
                          pass
                      else:
                          raise AssertionError(f'unsafe filename accepted: {bad!r}')

                  server = Path('server/server.py').read_text(encoding='utf-8')
                  assert "default='127.0.0.1'" in server
                  assert 'self.app.run(host=host' in server
                  config_source = Path('server/utils/config.py').read_text(encoding='utf-8')
                  assert 'def _safe_log_value' in config_source

                  updater = Path('server/utils/auto_update.py').read_text(encoding='utf-8')
                  assert '/releases/download/{tag}/server.zip' in updater
                  assert '下载的 Server 版本不匹配' in updater
                  assert '/raw/main/server.zip' not in updater
                  assert 'repository/archive' not in updater
                  assert '下载内容不是 zip' in updater

                  sys.path.insert(0, 'server')
                  from utils.auto_update import _looks_like_zip, _server_download_urls, _notice_applies, _notice_urls, _select_notices
                  from utils.deepseek_thinking import (
                      resolved_thinking_mode,
                      thinking_runtime_policy,
                  )
                  assert resolved_thinking_mode(None) == 'disabled'
                  assert resolved_thinking_mode('null') == 'disabled'
                  assert resolved_thinking_mode('disabled') == 'disabled'
                  assert resolved_thinking_mode('enabled') == 'enabled'
                  assert thinking_runtime_policy('disabled', False) == 'strip-and-allow'
                  assert thinking_runtime_policy(None, False) == 'strip-and-allow'
                  assert thinking_runtime_policy('enabled', False) == 'block'
                  assert thinking_runtime_policy('disabled', True) == 'pass-flags'
                  assert thinking_runtime_policy('enabled', True) == 'pass-flags'
                  with tempfile.TemporaryDirectory() as td:
                      html = os.path.join(td, 'page.html')
                      zpath = os.path.join(td, 'ok.zip')
                      open(html, 'wb').write(b'<!DOCTYPE html><html lang="zh-CN">not a zip')
                      with zipfile.ZipFile(zpath, 'w') as zf:
                          zf.writestr('server/server.py', '__version__ = "4.1.1"\n')
                      assert _looks_like_zip(zpath)
                      assert not _looks_like_zip(html)
                  gitee_urls = _server_download_urls('guaguastandup', 'zotero-pdf2zh', '4.1.1', 'gitee')
                  assert gitee_urls[0] == 'https://gitee.com/guaguastandup/zotero-pdf2zh/releases/download/v4.1.1/server.zip'
                  assert 'https://gitee.com/guaguastandup/zotero-pdf2zh/raw/v4.1.1/server.zip' in gitee_urls
                  assert 'https://github.com/guaguastandup/zotero-pdf2zh/releases/download/v4.1.1/server.zip' in gitee_urls
                  github_urls = _server_download_urls('guaguastandup', 'zotero-pdf2zh', '4.1.1', 'github')
                  assert github_urls[0] == 'https://github.com/guaguastandup/zotero-pdf2zh/releases/download/v4.1.1/server.zip'
                  assert 'https://raw.githubusercontent.com/guaguastandup/zotero-pdf2zh/v4.1.1/server.zip' in github_urls
                  assert 'https://gitee.com/guaguastandup/zotero-pdf2zh/releases/download/v4.1.1/server.zip' in github_urls
                  assert 'https://gitee.com/guaguastandup/zotero-pdf2zh/raw/v4.1.1/server.zip' in github_urls
                  assert 'https://raw.githubusercontent.com/guaguastandup/zotero-pdf2zh/v4.1.1/server.zip' in gitee_urls
                  assert gitee_urls[0] != github_urls[0]
                  assert all('repository/archive' not in url for url in gitee_urls + github_urls)

                  notice = json.loads(Path('server/notice.json').read_text(encoding='utf-8'))
                  assert isinstance(notice.get('notices'), list)
                  assert isinstance(notice.get('community'), dict)
                  assert notice['community'].get('qq_answer') == 'github'
                  assert any(group.get('status') == 'open' and group.get('id') for group in notice['community'].get('qq_groups', []))
                  gitee_notice, github_notice = _notice_urls('gitee')
                  assert gitee_notice.endswith('/raw/main/server/notice.json')
                  assert github_notice == 'https://raw.githubusercontent.com/guaguastandup/zotero-pdf2zh/main/server/notice.json'
                  assert _notice_applies({'enabled': False, 'affects': ['4.1.2']}, '4.1.2') is False
                  assert _notice_applies({'affects': ['4.1.0']}, '4.1.2') is False
                  assert _notice_applies({'affects': ['4.1.0']}, '4.1.0') is True
                  assert _notice_applies({'min_version': '4.1.0', 'max_version': '4.1.1'}, '4.1.0') is True
                  assert _notice_applies({'min_version': '4.1.0', 'max_version': '4.1.1'}, '4.1.2') is False
                  assert _notice_applies({'affects': ['*']}, '4.1.2') is True
                  assert _select_notices({'notices': [{'enabled': False, 'title': 'x'}, {'affects': ['4.1.2'], 'title': 'y'}]}, '4.1.2') == [{'affects': ['4.1.2'], 'title': 'y'}]

                  cfg = toml.load('server/config/config.toml.example')
                  for key in ('clitranslator', 'term_deepseek', 'term_openaicompatible'):
                      assert key in cfg
                  for section in ('clitranslator_detail', 'term_deepseek_detail', 'term_openaicompatible_detail'):
                      assert section in cfg
                  assert 'term_qps' in cfg['translation']
                  assert 'term_pool_max_workers' in cfg['translation']
                  assert cfg['deepseek_detail']['deepseek_model'] == 'deepseek-v4-flash'
                  assert 'deepseek_thinking_mode' in cfg['deepseek_detail']
                  assert 'deepseek_reasoning_effort' in cfg['deepseek_detail']
                  assert cfg['qwenmt_detail']['support_llm'] == 'no'
                  assert cfg['qwenmt_detail']['qwenmt_model'] == 'qwen-mt-plus'
                  assert cfg['term_deepseek_detail']['term_deepseek_model'] == 'deepseek-v4-flash'

                  for doc in ('docs/zh/guide/package-update.md', 'docs/en/guide/package-update.md'):
                      text = Path(doc).read_text(encoding='utf-8')
                      assert 'validates dependency completeness and the `pdf2zh_next --help` runtime' not in text
                      assert '检查依赖完整性和 `pdf2zh_next --help`' not in text

                  release = Path('.github/workflows/release.yml').read_text(encoding='utf-8')
                  assert 'zip -r server.zip server' in release
                  assert "grep -q 'server/server.py'" in release
                  assert 'plugin/build/zotero-pdf-2-zh.xpi --clobber' in release
                  print('Server security/config/updater invariants OK')
                  PY

            - name: Simulate Release server.zip layout
              run: |
                  rm -f /tmp/server.zip
                  zip -rq /tmp/server.zip server \
                    -x 'server/translated/*' \
                    -x 'server/zotero-pdf2zh-venv/*' \
                    -x 'server/zotero-pdf2zh-next-venv/*' \
                    -x 'server/config/config.json' \
                    -x 'server/config/config.toml' \
                    -x 'server/config/venv.json' \
                    -x 'server/__pycache__/*' \
                    -x 'server/*/__pycache__/*' \
                    -x '*.pyc'
                  unzip -l /tmp/server.zip | grep -q 'server/server.py'
                  unzip -l /tmp/server.zip | grep -q 'server/config/config.toml.example'
                  unzip -l /tmp/server.zip | grep -q 'server/update_packages.py'
                  unzip -l /tmp/server.zip | grep -q 'server/utils/deepseek_thinking.py'

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: plugin/package-lock.json

            - name: Install deps
              run: cd plugin/ && npm ci

            - name: Check plugin release invariants
              run: |
                  python - <<'PY'
                  from pathlib import Path

                  editor = Path('plugin/addon/content/llmApiEditor.xhtml').read_text(encoding='utf-8')
                  enhancements = Path('plugin/addon/content/llmApiEditorEnhancements.js').read_text(encoding='utf-8')
                  preference_script = Path('plugin/src/modules/preferenceScript.ts').read_text(encoding='utf-8')
                  helper = Path('plugin/src/modules/pdf2zhHelper.ts').read_text(encoding='utf-8')
                  processor = Path('plugin/src/modules/pdf2zhFileProcessor.ts').read_text(encoding='utf-8')
                  prefs = Path('plugin/addon/content/preferences.xhtml').read_text(encoding='utf-8')
                  zh_pref_path = Path('plugin/addon/locale/zh-CN/preferences.ftl')
                  en_pref_path = Path('plugin/addon/locale/en-US/preferences.ftl')
                  zh_addon_path = Path('plugin/addon/locale/zh-CN/addon.ftl')
                  en_addon_path = Path('plugin/addon/locale/en-US/addon.ftl')

                  deepseek_block = editor.split('deepseek: {', 1)[1].split('                },', 1)[0]
                  assert 'deepseek-v4-flash' in deepseek_block and 'deepseek-v4-pro' in deepseek_block
                  assert 'deepseek-chat' not in deepseek_block and 'deepseek-reasoner' not in deepseek_block
                  assert 'sanitizeDeepSeekHistory' in editor or 'sanitizeDeepSeekHistory' in enhancements
                  assert 'fetch-models-btn' in enhancements
                  assert 'function migrateLegacyDeepSeekConfig' in preference_script
                  assert 'legacyModel === "deepseek-reasoner"' in preference_script
                  assert 'llmApi.extraData.deepseek_thinking_mode = "enabled"' in preference_script
                  assert 'llmApi.extraData.deepseek_thinking_mode = "disabled"' in preference_script

                  assert 'getOperationValidationError' in helper
                  assert 'throw error;' in helper
                  assert 'removeListener();' in helper
                  assert 'apiKey: llmApiConfig.apiKey ? "********" : ""' in helper
                  assert 'ztoolkit.log("llmApiConfig", llmApiConfig)' not in helper
                  assert 'return () =>' in processor

                  def locale_keys(path):
                      result=set()
                      for line in path.read_text(encoding='utf-8').splitlines():
                          if not line or line[0].isspace() or line.lstrip().startswith('#') or '=' not in line:
                              continue
                          result.add(line.split('=',1)[0].strip())
                      return result

                  assert locale_keys(zh_pref_path) == locale_keys(en_pref_path)
                  assert locale_keys(zh_addon_path) == locale_keys(en_addon_path)
                  zh_addon = zh_addon_path.read_text(encoding='utf-8')
                  en_addon = en_addon_path.read_text(encoding='utf-8')
                  for key in (
                      'operation-error-translate',
                      'operation-error-crop',
                      'operation-error-compare',
                      'operation-error-crop-compare',
                      'operation-error-crop-compare-terminal',
                      'operation-error-compare-terminal',
                      'operation-error-no-selection',
                      'operation-error-single-file',
                      'operation-batch-started',
                      'operation-batch-completed',
                  ):
                      assert key in zh_addon and key in en_addon
                  assert 'data-l10n-id="pref-clear"' in prefs
                  print('Plugin release invariants OK')
                  PY

            - name: Check Prettier
              id: prettier
              continue-on-error: true
              run: |
                  cd plugin
                  npx prettier --list-different . | tee /tmp/prettier-files.txt
                  if [ -s /tmp/prettier-files.txt ]; then
                    while IFS= read -r file; do echo "::error file=plugin/$file::Prettier formatting required"; done < /tmp/prettier-files.txt
                    exit 1
                  fi

            - name: Check ESLint
              id: eslint
              continue-on-error: true
              run: cd plugin/ && npx eslint .

            - name: Fail lint job when a check failed
              if: always()
              run: |
                  if [ "${{ steps.prettier.outcome }}" != "success" ] || [ "${{ steps.eslint.outcome }}" != "success" ]; then exit 1; fi

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: plugin/package-lock.json

            - name: Install deps
              run: cd plugin/ && npm ci

            - name: Run Build
              run: cd plugin/ && npm run build

            - name: Verify XPI contents
              run: |
                  test -f plugin/build/zotero-pdf-2-zh.xpi
                  unzip -l plugin/build/zotero-pdf-2-zh.xpi | grep -q 'content/llmApiEditorEnhancements.js'
                  unzip -l plugin/build/zotero-pdf-2-zh.xpi | grep -q 'locale/en-US/pdf2zh-addon.ftl'
                  unzip -l plugin/build/zotero-pdf-2-zh.xpi | grep -q 'locale/zh-CN/pdf2zh-addon.ftl'

            - name: Upload build result
              uses: actions/upload-artifact@v4
              with:
                  name: build-result
                  path: plugin/build
