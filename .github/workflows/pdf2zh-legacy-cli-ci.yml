name: Legacy pdf2zh 1.x CLI Smoke

on:
    push:
        branches: [feat/deepseek-flash-thinking-hook]
        paths:
            - "server/utils/pdf2zh_font_retry.py"
            - "server/server.py"
            - "server/tests/test_pdf2zh_font_retry.py"
            - ".github/workflows/pdf2zh-legacy-cli-ci.yml"
    pull_request:
        paths:
            - "server/utils/pdf2zh_font_retry.py"
            - "server/server.py"
            - "server/tests/test_pdf2zh_font_retry.py"
            - ".github/workflows/pdf2zh-legacy-cli-ci.yml"

permissions:
    contents: read

jobs:
    legacy-cli:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install released legacy engine
              run: |
                  python -m pip install --disable-pip-version-check "pdf2zh==1.9.11" "bitstring>=4.3.0,<5" "tencentcloud-sdk-python-tmt<3.1"
            - name: Validate CLI flags without sending translation requests
              shell: python
              run: |
                  import subprocess
                  from importlib.metadata import version
                  assert version("pdf2zh") == "1.9.11"
                  proc = subprocess.run(
                      ["pdf2zh", "--help"],
                      text=True, capture_output=True, timeout=90
                  )
                  print("CLI exit code:", proc.returncode)
                  print("CLI output:", (proc.stdout or "")[-1800:])
                  print("stderr:", (proc.stderr or "")[-1800:])
                  assert proc.returncode == 0
                  assert "--skip-subset-fonts" in proc.stdout
            - name: Verify narrow retry behavior
              env:
                  PYTHONPATH: server
              run: python -m unittest discover -s server/tests -p 'test_pdf2zh_font_retry.py'
