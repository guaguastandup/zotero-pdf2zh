name: Windows Environment CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    windows-conda-paths:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Test Windows uv and Conda layouts
              shell: pwsh
              env:
                  PYTHONPATH: server
              run: |
                  @'
                  import os
                  import tempfile
                  from pathlib import Path
                  from unittest.mock import patch

                  from utils import environment_lifecycle as lifecycle
                  from utils.venv import VirtualEnvManager

                  assert lifecycle.platform.system() == 'Windows'

                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)

                      uv_dir = root / 'uv-env'
                      uv_python = uv_dir / 'Scripts' / 'python.exe'
                      uv_python.parent.mkdir(parents=True)
                      uv_python.touch()
                      assert lifecycle.resolve_environment_python(uv_dir) == uv_python
                      assert lifecycle.resolve_environment_root(uv_python) == uv_dir

                      conda_dir = root / 'conda-env'
                      conda_python = conda_dir / 'python.exe'
                      (conda_dir / 'conda-meta').mkdir(parents=True)
                      (conda_dir / 'Scripts').mkdir(parents=True)
                      (conda_dir / 'Library' / 'bin').mkdir(parents=True)
                      conda_python.touch()
                      conda_cli = conda_dir / 'Scripts' / 'pdf2zh_next.exe'
                      conda_cli.touch()

                      assert lifecycle.resolve_environment_python(conda_dir) == conda_python
                      assert lifecycle.resolve_environment_root(conda_python) == conda_dir

                      path_entries = lifecycle.environment_path_entries(conda_dir, 'conda')
                      assert conda_dir in path_entries
                      assert conda_dir / 'Scripts' in path_entries
                      assert conda_dir / 'Library' / 'bin' in path_entries

                      with patch.object(lifecycle, 'find_conda_env_path', return_value=conda_dir):
                          existing = lifecycle.find_existing_environment('pdf2zh_next', 'conda')
                      assert existing == ('conda', conda_dir, conda_python)

                      names = {
                          'pdf2zh': 'zotero-pdf2zh-venv',
                          'pdf2zh_next': 'zotero-pdf2zh-next-venv',
                      }
                      manager = VirtualEnvManager('missing.json', names, 'conda', skip_install=True)
                      manager.curr_envtool = 'conda'
                      manager.curr_envname = names['pdf2zh_next']
                      manager.ensure_env = lambda engine: True
                      manager._existing = lambda engine, tool: ('conda', conda_dir, conda_python)
                      final_cmd, env = manager._resolved_command(['pdf2zh_next', '--version'])
                      assert Path(final_cmd[0]) == conda_cli
                      effective_path = env['PATH'].split(os.pathsep)
                      assert str(conda_dir) in effective_path
                      assert str(conda_dir / 'Scripts') in effective_path
                      assert str(conda_dir / 'Library' / 'bin') in effective_path

                  print('Windows uv/Conda path semantics OK')
                  '@ | python -

            - name: Compile Server sources
              shell: pwsh
              run: python -m compileall -q server
