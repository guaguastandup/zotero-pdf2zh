    <style>
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            width: 100%;

            min-height: 400px;
            box-sizing: border-box;
            /* font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                sans-serif; */
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }
        .form-group .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        /* 统一的输入组样式 */
        .input-group {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
            background-color: #fff;
        }
        .input-group-left {
            flex: 1;
            border: none;
            padding: 10px 12px;
            font-size: 14px;
            margin: 0;
            outline: none;
        }
        .input-group-select {
            flex: 0 0 32px;
            width: 32px;
            border: none;
            border-left: 1px solid #eee;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            cursor: pointer;
            -moz-appearance: none;
            appearance: none;
            color: transparent;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 14px;
        }
        .input-group-delete {
            flex: 0 0 32px;
            width: 32px;
            border: none;
            border-left: 1px solid #eee;
            background-color: #fff;
            cursor: pointer;
            color: #e74c3c;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .input-group-delete:disabled {
            color: #ddd;
            cursor: default;
            background-color: #fafafa;
        }
        .input-group-delete:hover:not(:disabled) {
            background-color: #fff5f5;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .model-list-link {
            color: #3498db;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .model-list-link.hidden {
            visibility: hidden;
            pointer-events: none;
        }
        .model-list-link svg {
            width: 14px;
            height: 14px;
            margin-left: 4px;
        }

        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        .extra-field-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .extra-field-row input,
        .extra-field-row select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
        }
        .extra-field-row input[readonly] {
            background-color: #f5f5f5;
            color: #555;
        }
        .extra-fields-hint {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
            margin: 4px 0 8px;
        }

    <body>
        <div class="form-container">
            <h2 id="dialog-title">LLM API 配置</h2>

            <div class="form-group">
                <label
                    ><span id="label-service-name">LLM服务名称</span
                    ><span class="required">*</span></label
                >
                <div class="input-group">
                    <input
                        id="service"
                        class="input-group-left"
                        type="text"
                        placeholder="选择或输入服务 (如: deepseek)"
                    />
                    <select
                        id="serviceselect"
                        class="input-group-select"
                    ></select>
                    <button
                        type="button"
                        id="btn-del-service"
                        class="input-group-delete"
                        title="删除自定义服务"
                    >
                        ×
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label id="label-model">模型名称</label>
                <div class="input-group">
                    <input
                        id="model"
                        type="text"
                        class="input-group-left"
                        placeholder="选择或输入模型 (如: deepseek-v4-flash)"
                    />
                    <select
                        id="modelselect"
                        class="input-group-select"
                    ></select>
                    <button
                        type="button"
                        id="btn-del-model"
                        class="input-group-delete"
                        title="删除自定义模型"
                    >
                        ×
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label id="label-api-key">LLM API KEY</label>
                <div class="input-group">
                    <input
                        id="apiKey"
                        type="text"
                        class="input-group-left"
                        placeholder="sk-..."
                        autocomplete="off"
                    />
                    <select
                        id="apiKeySelect"
                        class="input-group-select"
                    ></select>
                    <button
                        type="button"
                        id="btn-del-apiKey"
                        class="input-group-delete"
                        title="删除API Key记录"
                    >
                        ×
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label id="label-base-url">LLM BASE URL</label>
                <div class="input-group">
                    <input
                        id="apiUrl"
                        type="text"
                        class="input-group-left"
                        placeholder="https://..."
                        autocomplete="off"
                    />
                    <select
                        id="apiUrlSelect"
                        class="input-group-select"
                    ></select>
                    <button
                        type="button"
                        id="btn-del-url"
                        class="input-group-delete"
                        title="删除自定义URL"
                    >
                        ×
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label
                    style="
                        display: inline-flex;
                        align-items: center;
                        cursor: pointer;
                    "
                >
                    <input
                        type="checkbox"
                        id="activate"
                        style="margin-right: 8px"
                    />
                    <span id="activate-label"
                        >激活此配置 (相同服务类型的其他配置将被自动停用)</span
                    >
                </label>
            </div>

            <div class="form-group">
                <label id="label-extra-params">额外参数</label>
                <p id="extra-fields-hint" class="extra-fields-hint"></p>
                <div id="extra-fields-container"></div>
                <datalist id="extra-field-keys"></datalist>
                <button
                    type="button"
                    id="add-extra-field-btn"
                    class="btn btn-secondary"
                    style="margin-top: 5px; padding: 5px 10px; font-size: 12px"
                >
                    + 添加参数
                </button>
            </div>

            <div class="button-container">
                <a
                    id="service-doc-link"
                    class="model-list-link hidden"
                    target="_blank"
                >
                    <span id="service-doc-link-text">查看支持的模型列表</span>
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                        ></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </a>
                <div style="display: flex">
                    <button class="btn btn-secondary" id="cancel-btn">
                        取消
                    </button>
                    <button class="btn btn-primary" id="save-btn">保存</button>
                </div>
            </div>
        </div>

            let uiLanguage = "en";
            const DEPRECATED_DEEPSEEK_MODELS = new Set([
                "deepseek-chat",
                "deepseek-reasoner",
            ]);

            function getUiLanguage() {
                let locale = "";
                try {
                    locale = (Zotero && Zotero.locale) || "";
                } catch (e) {}
                try {
                    if (!locale && Services && Services.locale) {
                        locale = Services.locale.appLocaleAsBCP47 || "";
                    }
                } catch (e) {}
                if (!locale) locale = navigator.language || "en-US";
                return String(locale).toLowerCase().startsWith("zh")
                    ? "zh"
                    : "en";
            }

            function t(key) {
                return UI_TEXT[uiLanguage][key] || UI_TEXT.en[key] || key;
            }

            function applyLocalization() {
                uiLanguage = getUiLanguage();
                document.documentElement.lang =
                    uiLanguage === "zh" ? "zh-CN" : "en-US";

                document.getElementById("btn-del-apiKey").title =

                document.getElementById("btn-del-url").title =

                document.getElementById("add-extra-field-btn").textContent =
                    t("addParam");
                document.getElementById("service-doc-link-text").textContent =
                    t("modelList");
                document.getElementById("cancel-btn").textContent = t("cancel");
                document.getElementById("save-btn").textContent = t("save");
                refreshExtraFieldSuggestions();
            }

            function sanitizeDeepSeekHistory(userHistory) {
                const deepseekHistory = userHistory && userHistory.deepseek;
                if (
                    !deepseekHistory ||
                    !Array.isArray(deepseekHistory.models)
                ) {
                    return userHistory;
                }
                const filtered = deepseekHistory.models.filter(
                    (model) => !DEPRECATED_DEEPSEEK_MODELS.has(model),
                );
                if (filtered.length !== deepseekHistory.models.length) {
                    deepseekHistory.models = filtered;
                    safeSetStorage(userHistory);
                }
                return userHistory;
            }

            document.addEventListener("DOMContentLoaded", function () {
                initGlobals();
                applyLocalization();
                if (
                    window.arguments &&
                    window.arguments[0] &&
                    window.arguments[0]._initPromise
                ) {
                    window.arguments[0]._initPromise.resolve();
                }
                loadAllData();
                initializeForm();
                bindEvents();
            });

            function initGlobals() {
                if (typeof Services === "undefined") {
                    try {
                        Components.utils.import(
                            "resource://gre/modules/Services.jsm",
                        );
                    } catch (e) {
                        try {
                            const { Services: S } = ChromeUtils.import(
                                "resource://gre/modules/Services.jsm",
                            );
                            Services = S;
                        } catch (e2) {}
                    }
                }
                try {
                    let win =
                        Services.wm.getMostRecentWindow("navigator:browser");
                    Zotero = win.Zotero;
                } catch (e) {}
                try {
                    Services.scriptloader.loadSubScript(
                        "resource://zotero/require.js",
                        this,
                    );
                } catch (e) {}
            }

            function safeGetStorage() {
                try {
                    if (Zotero && Zotero.Prefs) {
                        const val = Zotero.Prefs.get(HISTORY_PREF_KEY);
                        if (val) return JSON.parse(val);
                    }
                } catch (e) {}
                return {};
            }

            function safeSetStorage(data) {
                try {
                    if (Zotero && Zotero.Prefs) {
                        Zotero.Prefs.set(
                            HISTORY_PREF_KEY,
                            JSON.stringify(data),
                        );
                    }
                } catch (e) {}
            }

            // 加载数据，合并 Models, URLs 和 API Keys
            function loadAllData() {
                const userHistory = sanitizeDeepSeekHistory(safeGetStorage());
                mergedServices = JSON.parse(JSON.stringify(DEFAULT_SERVICES));

                for (const key in userHistory) {
                    const data = userHistory[key];
                    if (!mergedServices[key])
                        mergedServices[key] = {
                            name: data.name || key,
                            models: [],
                            urls: [],
                            apiKeys: [],
                        };

                    // Helper to merge arrays
                    const mergeArray = (prop) => {
                        if (data[prop] && Array.isArray(data[prop])) {
                            if (!mergedServices[key][prop])
                                mergedServices[key][prop] = [];
                            data[prop].forEach((item) => {
                                if (!mergedServices[key][prop].includes(item))
                                    mergedServices[key][prop].unshift(item);
                            });
                        }
                    };

                    mergeArray("models");
                    mergeArray("urls");
                    mergeArray("apiKeys"); // 新增：合并 API Key
                }
            }

            // 保存历史 (Key, Model, URL)
            function saveUserHistory(service, model, url, apiKey) {
                if (!service) return;
                const userHistory = safeGetStorage();
                if (!userHistory[service])
                    userHistory[service] = {
                        name: service,
                        models: [],
                        urls: [],
                        apiKeys: [],
                    };

                const saveItem = (prop, value, defaultList) => {
                    if (
                        value &&
                        (!defaultList || !defaultList.includes(value))
                    ) {
                        if (!userHistory[service][prop])
                            userHistory[service][prop] = [];
                        // 避免重复，如果已存在先移除再放到头部（最近使用）
                        userHistory[service][prop] = userHistory[service][
                            prop
                        ].filter((v) => v !== value);
                        userHistory[service][prop].unshift(value);
                    }
                };

                const defModels =
                    (DEFAULT_SERVICES[service] &&
                        DEFAULT_SERVICES[service].models) ||
                    [];
                saveItem(
                    "models",
                    service === "deepseek" &&
                        DEPRECATED_DEEPSEEK_MODELS.has(model)
                        ? ""
                        : model,
                    defModels,
                );

                const defUrls =
                    (DEFAULT_SERVICES[service] &&
                        DEFAULT_SERVICES[service].urls) ||
                    [];
                saveItem("urls", url, defUrls);

                // API Key 没有默认列表，直接存
                saveItem("apiKeys", apiKey, []);

                safeSetStorage(userHistory);
                loadAllData();
            }

            // 删除历史
            function deleteUserItem(type, value) {
                const serviceKey = document.getElementById("service").value;
                if (!serviceKey || !value) return;
                const userHistory = safeGetStorage();

                if (userHistory[serviceKey]) {
                    const propMap = {
                        model: "models",
                        url: "urls",
                        apiKey: "apiKeys",
                    };

                    if (type === "service") {
                        delete userHistory[serviceKey];
                    } else {
                        const prop = propMap[type];
                        if (prop && userHistory[serviceKey][prop]) {
                            userHistory[serviceKey][prop] = userHistory[
                                serviceKey
                            ][prop].filter((v) => v !== value);
                        }
                    }

                    safeSetStorage(userHistory);
                    loadAllData();

                    if (type === "service") {
                        populateServiceOptions();
                        document.getElementById("service").value = "";
                        document
                            .getElementById("service")
                            .dispatchEvent(new Event("input"));
                    } else {
                        // 刷新对应的下拉框
                        if (type === "model") updateModelOptions(serviceKey);
                        if (type === "url")
                            updateUrlSelectOptions(
                                serviceKey,
                                document.getElementById("apiUrl").value,
                            );
                        if (type === "apiKey")
                            updateApiKeyOptions(
                                serviceKey,
                                document.getElementById("apiKey").value,
                            );

                        // 清空输入框
                        let inputId = "";
                        if (type === "model") inputId = "model";
                        else if (type === "url") inputId = "apiUrl";
                        else if (type === "apiKey") inputId = "apiKey";

                        if (inputId)
                            document.getElementById(inputId).value = "";
                    }
                    checkAllDeleteButtons();
                }
            }

            // UI Helpers
            function getCurrentServiceKey() {
                return (
                    document.getElementById("service")?.value || ""
                ).trim();
            }

            function getSupportedExtraFields(serviceKey) {
                const canonical =
                    PDF2ZH_NEXT_SERVICE_ALIASES[serviceKey] || serviceKey;
                return PDF2ZH_NEXT_EXTRA_FIELDS[canonical] || [];
            }

            function extraFieldLabel(field) {
                return uiLanguage === "zh" ? field.zh : field.en;
            }

            function findExtraFieldMeta(key) {
                if (!key) return null;
                const catalog = getSupportedExtraFields(getCurrentServiceKey());
                return catalog.find((field) => field.key === key) || null;
            }

            function usedExtraKeys() {
                return Array.from(
                    document.getElementsByClassName("extra-key"),
                )
                    .map((el) => (el.value || "").trim())
                    .filter(Boolean);
            }

            function refreshExtraFieldSuggestions() {
                const catalog = getSupportedExtraFields(getCurrentServiceKey());
                const used = new Set(usedExtraKeys());
                const datalist = document.getElementById("extra-field-keys");
                if (datalist) {
                    while (datalist.firstChild)
                        datalist.removeChild(datalist.firstChild);
                    catalog.forEach((field) => {
                        if (used.has(field.key)) return;
                        const option = document.createElement("option");
                        option.value = field.key;
                        option.label =
                            field.key + " — " + extraFieldLabel(field);
                        datalist.appendChild(option);
                    });
                }
                const hint = document.getElementById("extra-fields-hint");
                if (!hint) return;
                if (!catalog.length) {
                    hint.textContent = t("extraFieldsHintEmpty");
                    return;
                }
                const names = catalog
                    .map((field) => field.key)
                    .join(", ");
                hint.textContent = t("extraFieldsHint").replace(
                    "{fields}",
                    names,
                );
            }

            function appendSelectOption(select, value, label) {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = label;
                select.appendChild(option);
            }

            function createExtraValueWidget(key, value = "") {
                const deepseekField = DEEPSEEK_THINKING_FIELDS[key];
                if (deepseekField) {
                    const select = document.createElement("select");
                    select.setAttribute("data-extra-type", "deepseek");
                    deepseekField.values.forEach((fieldValue) => {
                        appendSelectOption(select, fieldValue, fieldValue);
                    });
                    select.value = deepseekField.values.includes(value)
                        ? value
                        : deepseekField.defaultValue;
                    select.title = t(deepseekField.titleKey);
                    return select;
                }

                const field = findExtraFieldMeta(key);
                const normalized =
                    value === true
                        ? "true"
                        : value === false
                          ? "false"
                          : String(value ?? "");

                if (field && field.type === "bool") {
                    const select = document.createElement("select");
                    select.setAttribute("data-extra-type", "bool");
                    appendSelectOption(select, "", t("extraFieldUnset"));
                    appendSelectOption(select, "true", "true");
                    appendSelectOption(select, "false", "false");
                    select.value =
                        normalized === "true" || normalized === "false"
                            ? normalized
                            : "";
                    return select;
                }

                if (field && field.type === "enum") {
                    const select = document.createElement("select");
                    select.setAttribute("data-extra-type", "enum");
                    appendSelectOption(select, "", t("extraFieldUnset"));
                    (field.values || []).forEach((fieldValue) => {
                        appendSelectOption(select, fieldValue, fieldValue);
                    });
                    select.value = (field.values || []).includes(normalized)
                        ? normalized
                        : "";
                    return select;
                }

                const input = document.createElement("input");
                input.type = "text";
                input.setAttribute("data-extra-type", "text");
                input.placeholder = t("parameterValue");
                input.value = normalized;
                return input;
            }

            function syncExtraValueWidget(row) {
                const keyInput = row.querySelector(".extra-key");
                const current = row.querySelector(".extra-value");
                if (!keyInput || !current) return;
                const key = (keyInput.value || "").trim();
                const next = createExtraValueWidget(key, current.value);
                next.className = "extra-value";
                const nextType = next.getAttribute("data-extra-type");
                const currentType = current.getAttribute("data-extra-type");
                if (
                    next.tagName === current.tagName &&
                    nextType === currentType
                ) {
                    return;
                }
                current.replaceWith(next);
                if (key === "deepseek_thinking_mode") {
                    next.addEventListener(
                        "change",
                        updateDeepSeekReasoningEffortState,
                    );
                }
            }

            function addExtraFieldRow(key = "", value = "") {
                const container = document.getElementById(
                    "extra-fields-container",
                );
                const div = document.createElement("div");
                div.className = "extra-field-row";
                const inputKey = document.createElement("input");
                inputKey.type = "text";
                inputKey.className = "extra-key";
                inputKey.placeholder = t("parameterName");
                inputKey.value = key;
                inputKey.setAttribute("list", "extra-field-keys");

                const deepseekField = DEEPSEEK_THINKING_FIELDS[key];
                if (deepseekField) {
                    inputKey.readOnly = true;
                    inputKey.title = t(deepseekField.titleKey);
                } else {
                    inputKey.addEventListener("input", () => {
                        syncExtraValueWidget(div);
                        refreshExtraFieldSuggestions();
                    });
                    inputKey.addEventListener("change", () => {
                        syncExtraValueWidget(div);
                        refreshExtraFieldSuggestions();
                    });
                }

                const inputValue = createExtraValueWidget(key, value);
                inputValue.className = "extra-value";

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn btn-danger";
                btn.style.padding = "6px 10px";
                btn.textContent = "×";
                btn.onclick = function () {
                    container.removeChild(div);
                    refreshExtraFieldSuggestions();
                };
                div.appendChild(inputKey);
                div.appendChild(inputValue);
                div.appendChild(btn);
                container.appendChild(div);

                if (key === "deepseek_thinking_mode") {
                    inputValue.addEventListener(
                        "change",
                        updateDeepSeekReasoningEffortState,
                    );
                }
                refreshExtraFieldSuggestions();
            }

            function findExtraFieldRow(key) {
                const rows = document
                    .getElementById("extra-fields-container")
                    .getElementsByClassName("extra-field-row");
                return Array.from(rows).find(
                    (row) => row.querySelector(".extra-key")?.value === key,
                );
            }

            function removeExtraFieldRow(key) {
                const row = findExtraFieldRow(key);
                if (row) row.remove();
            }

            function ensureDeepSeekThinkingFields() {
                for (const [key, fieldConfig] of Object.entries(
                    DEEPSEEK_THINKING_FIELDS,
                )) {
                    if (!findExtraFieldRow(key)) {
                        addExtraFieldRow(key, fieldConfig.defaultValue);
                    }
                }
                updateDeepSeekReasoningEffortState();
            }

            function updateDeepSeekReasoningEffortState() {
                const modeRow = findExtraFieldRow("deepseek_thinking_mode");
                const effortRow = findExtraFieldRow(
                    "deepseek_reasoning_effort",
                );
                if (!modeRow || !effortRow) return;
                const mode = modeRow.querySelector(".extra-value")?.value;
                const effortSelect = effortRow.querySelector(".extra-value");
                const enabled = mode === "enabled";
                if (effortSelect) effortSelect.disabled = !enabled;
                effortRow.style.opacity = enabled ? "1" : "0.55";
            }

            function syncDeepSeekThinkingFields(serviceKey) {
                if (serviceKey === "deepseek") {
                    ensureDeepSeekThinkingFields();
                } else {
                    removeExtraFieldRow("deepseek_thinking_mode");
                    removeExtraFieldRow("deepseek_reasoning_effort");
                }
                refreshExtraFieldSuggestions();
            }

            function updateDocLink(serviceKey) {
                const linkEl = document.getElementById("service-doc-link");
                const serviceConfig = DEFAULT_SERVICES[serviceKey];
                if (serviceConfig && serviceConfig.modelListUrl) {
                    linkEl.href = serviceConfig.modelListUrl;
                    linkEl.classList.remove("hidden");
                    linkEl.title = t("openModelList");
                } else {
                    linkEl.classList.add("hidden");
                    linkEl.href = "#";
                }
            }

            // 通用下拉框更新函数
            function updateSelectOptions(
                selectId,
                optionsList,
                currentValue,
                isUrlLike = false,
            ) {
                const select = document.getElementById(selectId);
                while (select.firstChild) select.removeChild(select.firstChild);

                const defOpt = document.createElement("option");
                defOpt.value = "";
                defOpt.text = isUrlLike ? "▼" : t("selectPlaceholder");
                // 如果列表为空，或者当前值不在列表中，可以把默认选项设为选中(视需求)
                select.appendChild(defOpt);

                // 去重
                const uniqueList = [...new Set(optionsList)];

                let matched = false;
                uniqueList.forEach((item) => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.text = item;
                    if (currentValue && item === currentValue) {
                        option.selected = true;
                        matched = true;
                    }
                    select.appendChild(option);
                });

                if (matched || (isUrlLike && currentValue))
                    defOpt.selected = false;
                else if (!currentValue) defOpt.selected = true;
            }

            // 各个字段的更新包装器
            function populateServiceOptions() {
                const keys = Object.keys(mergedServices);
                const names = keys.map((k) => mergedServices[k].name || k); // 这里为了简单，value还是用key
                // 这里逻辑稍不同，因为Service下拉框存的是key
                const select = document.getElementById("serviceselect");
                while (select.firstChild) select.removeChild(select.firstChild);
                const defOpt = document.createElement("option");
                defOpt.value = "";
                defOpt.text = t("selectPlaceholder");
                select.appendChild(defOpt);
                keys.forEach((k) => {
                    const option = document.createElement("option");
                    option.value = k;
                    option.text = mergedServices[k].name || k;
                    select.appendChild(option);
                });
            }

            function updateModelOptions(service) {
                const list =
                    service &&
                    mergedServices[service] &&
                    mergedServices[service].models
                        ? mergedServices[service].models
                        : [];
                updateSelectOptions(
                    "modelselect",
                    list,
                    document.getElementById("model").value,
                );
            }

            function updateUrlSelectOptions(service, currentVal) {
                const list =
                    service &&
                    mergedServices[service] &&
                    mergedServices[service].urls
                        ? mergedServices[service].urls
                        : [];
                updateSelectOptions("apiUrlSelect", list, currentVal, true);
            }

            function updateApiKeyOptions(service, currentVal) {
                const list =
                    service &&
                    mergedServices[service] &&
                    mergedServices[service].apiKeys
                        ? mergedServices[service].apiKeys
                        : [];
                // API Key 也用 "▼" 风格，比较省空间
                updateSelectOptions("apiKeySelect", list, currentVal, true);
            }

            function bindInputSelectValue(value, type) {
                if (type == "service") {
                    document.getElementById("service").value = value;
                    document.getElementById("serviceselect").value = value;
                } else if (type == "model") {
                    document.getElementById("model").value = value;
                    document.getElementById("modelselect").value = value;
                }
            }

            function checkAllDeleteButtons() {
                const s = document.getElementById("service").value;
                const m = document.getElementById("model").value;
                const u = document.getElementById("apiUrl").value;
                const k = document.getElementById("apiKey").value;

                const isCustomService = s && !DEFAULT_SERVICES[s];
                const isCustomModel =
                    m &&
                    (isCustomService ||
                        !DEFAULT_SERVICES[s]?.models?.includes(m));
                const isCustomUrl =
                    u &&
                    (isCustomService ||
                        !DEFAULT_SERVICES[s]?.urls?.includes(u));
                // API Key 总是用户自定义的，只要非空就可以删
                const isCustomKey = !!k;

                toggleBtn("btn-del-service", isCustomService);
                toggleBtn("btn-del-model", isCustomModel);
                toggleBtn("btn-del-url", isCustomUrl);
                toggleBtn("btn-del-apiKey", isCustomKey);
            }

            function toggleBtn(id, enable) {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.disabled = !enable;
                    btn.title = enable ? t("deleteRecord") : t("cannotDelete");
                }
            }

            function initializeForm() {
                let args =
                    window.arguments && window.arguments[0]
                        ? window.arguments[0]
                        : {};
                currentData = args.data || {};
                isEditMode = args.isEdit || false;

                document.getElementById("dialog-title").textContent = isEditMode
                    ? t("editTitle")
                    : t("addTitle");

                populateServiceOptions();

                if (currentData.service)
                    bindInputSelectValue(currentData.service, "service");
                if (currentData.model)
                    bindInputSelectValue(currentData.model, "model");
                if (currentData.apiKey)
                    document.getElementById("apiKey").value =
                        currentData.apiKey;
                if (currentData.apiUrl)
                    document.getElementById("apiUrl").value =
                        currentData.apiUrl;

                const currentService = document.getElementById("service").value;
                updateModelOptions(currentService);
                updateUrlSelectOptions(
                    currentService,
                    document.getElementById("apiUrl").value,
                );
                updateApiKeyOptions(
                    currentService,
                    document.getElementById("apiKey").value,
                );
                updateDocLink(currentService);

                document.getElementById("activate").checked =
                    currentData.activate !== undefined
                        ? currentData.activate
                        : true;

                if (currentData.extraData) {
                    for (const key in currentData.extraData)
                        addExtraFieldRow(key, currentData.extraData[key]);
                }
                syncDeepSeekThinkingFields(currentService);
                refreshExtraFieldSuggestions();
                checkAllDeleteButtons();
            }

            function bindEvents() {
                document
                    .getElementById("save-btn")
                    .addEventListener("click", saveLLMApi);
                document
                    .getElementById("cancel-btn")
                    .addEventListener("click", () => window.close());
                document
                    .getElementById("add-extra-field-btn")
                    .addEventListener("click", () => addExtraFieldRow());

                document
                    .getElementById("service-doc-link")
                    .addEventListener("click", function (e) {
                        e.preventDefault();
                        const url = this.getAttribute("href");
                        if (url && url !== "#") {
                            if (
                                typeof Zotero !== "undefined" &&
                                Zotero.launchURL
                            ) {
                                Zotero.launchURL(url);
                            } else {
                                window.open(url, "_blank");
                            }
                        }
                    });

                // Service Listener
                const sInput = document.getElementById("service");
                const sSelect = document.getElementById("serviceselect");

                sInput.addEventListener("input", (e) => {
                    const val = e.target.value;
                    bindInputSelectValue(val, "service");
                    // 只有当 serviceName 匹配时，或者用户清空时才尝试刷新列表；防止用户输入新名字时列表抖动
                    if (!val || mergedServices[val]) {
                        updateModelOptions(val);
                        updateUrlSelectOptions(
                            val,
                            document.getElementById("apiUrl").value,
                        );
                        updateApiKeyOptions(
                            val,
                            document.getElementById("apiKey").value,
                        );
                        updateDocLink(val);
                    }
                    syncDeepSeekThinkingFields(val);
                    checkAllDeleteButtons();
                });

                sSelect.addEventListener("change", (e) => {
                    const val = e.target.value;
                    if (!val) return;
                    bindInputSelectValue(val, "service");

                    // 自动填充 URL (取第一个默认值)
                    const apiUrlInput = document.getElementById("apiUrl");
                    const urls =
                        mergedServices[val] && mergedServices[val].urls
                            ? mergedServices[val].urls
                            : [];
                    apiUrlInput.value = urls.length > 0 ? urls[0] : "";

                    // 清空 Key 和 Model (切换服务通常意味着这些都变了)
                    // document.getElementById("apiKey").value = "";
                    // document.getElementById("model").value = "";
                    // 上面两行按需开启。如果你希望切换服务保留文字，就注释掉。

                    updateModelOptions(val);
                    updateUrlSelectOptions(val, apiUrlInput.value);
                    updateApiKeyOptions(
                        val,
                        document.getElementById("apiKey").value,
                    );
                    updateDocLink(val);
                    syncDeepSeekThinkingFields(val);
                    checkAllDeleteButtons();
                });

                // Helper for binding Input+Select pairs
                const bindPair = (inputId, selectId, type) => {
                    const input = document.getElementById(inputId);
                    const select = document.getElementById(selectId);

                    input.addEventListener("input", () => {
                        // 仅仅更新删除按钮状态，不强制刷新 Select，保留 Select 里的历史记录
                        checkAllDeleteButtons();
                    });

                    select.addEventListener("change", (e) => {
                        if (e.target.value) {
                            input.value = e.target.value;
                            const event = document.createEvent("HTMLEvents");
                            event.initEvent("input", true, true);
                            input.dispatchEvent(event);
                        }
                    });
                };

                bindPair("model", "modelselect", "model");
                bindPair("apiUrl", "apiUrlSelect", "url");
                bindPair("apiKey", "apiKeySelect", "apiKey");

                // Delete Buttons
                document
                    .getElementById("btn-del-service")
                    .addEventListener("click", () => {
                        const val = document.getElementById("service").value;
                        if (
                            val &&
                            confirm(t("confirmDeleteService") + val + "?")
                        )
                            deleteUserItem("service", val);
                    });
                document
                    .getElementById("btn-del-model")
                    .addEventListener("click", () =>
                        deleteUserItem(
                            "model",
                            document.getElementById("model").value,
                        ),
                    );
                document
                    .getElementById("btn-del-url")
                    .addEventListener("click", () =>
                        deleteUserItem(
                            "url",
                            document.getElementById("apiUrl").value,
                        ),
                    );
                document
                    .getElementById("btn-del-apiKey")
                    .addEventListener("click", () =>
                        deleteUserItem(
                            "apiKey",
                            document.getElementById("apiKey").value,
                        ),
                    );
            }

            function saveLLMApi() {
                let extraDataObject = {};
                const rows = document
                    .getElementById("extra-fields-container")
                    .getElementsByClassName("extra-field-row");
                for (let i = 0; i < rows.length; i++) {
                    const k = rows[i].querySelector(".extra-key").value;
                    const v = rows[i].querySelector(".extra-value").value;
                    if (k && v !== "") extraDataObject[k] = v;
                }

                const s = document.getElementById("service").value;
                const m = document.getElementById("model").value;
                const k = document.getElementById("apiKey").value;
                const u = document.getElementById("apiUrl").value.trim();
                const a = document.getElementById("activate").checked;

                if (s === "deepseek" && DEPRECATED_DEEPSEEK_MODELS.has(m)) {
                    alert(t("deprecatedDeepSeekModel"));
                    return;
                }

                if (s === "deepseek") {
                    const mode = extraDataObject.deepseek_thinking_mode;
                    if (mode !== "enabled") {
                        extraDataObject.deepseek_thinking_mode = "disabled";
                        delete extraDataObject.deepseek_reasoning_effort;
                    } else if (
                        !["high", "max"].includes(
                            extraDataObject.deepseek_reasoning_effort,
                        )
                    ) {
                        extraDataObject.deepseek_reasoning_effort = "high";
                    }
                }

                saveUserHistory(s, m, u, k);

                const formData = {
                    service: s,
                    model: m,
                    apiKey: k,
                    apiUrl: u,
                    activate: a,
                    extraData: extraDataObject,
                };
                if (window.arguments && window.arguments[0]) {
                    window.arguments[0].result = {
                        success: true,
                        data: formData,
                        isEdit: isEditMode,
                        originalKey: currentData.key,
                    };
                }
                window.close();
            }
            window.saveLLMApi = saveLLMApi;
            // ]]>
        </script>
        <script src="llmApiEditorEnhancements.js"></script>
